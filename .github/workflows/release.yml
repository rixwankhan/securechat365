name: Build desktop

# Tauri desktop builds cannot cross-compile: each platform must be built on
# itself. This is how you get a Windows binary without owning a Windows machine.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            name: macos-arm64
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            name: macos-intel
          - platform: windows-latest
            args: ""
            name: windows
          - platform: ubuntu-22.04
            args: ""
            name: linux

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          # Baked into the binary at compile time. Set this as a repository
          # variable so a fork or a mistyped workflow can't silently ship a
          # build pointing at someone else's relay.
          VEIL_RELAY_URL: ${{ vars.VEIL_RELAY_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # macOS signing and notarisation. Leave these secrets unset and the
          # build still succeeds — it just produces an unsigned bundle that
          # Gatekeeper will block on other machines.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: app
          args: ${{ matrix.args }}

      # Where the bundles actually land, for future reference: app/src-tauri is
      # a member of the workspace at the repo root, and Cargo workspaces share
      # ONE target directory at that root. So it's ./target, never
      # ./app/src-tauri/target. The ** covers per-target subdirectories that
      # appear when --target is passed.
      - name: Show what was built
        shell: bash
        run: find target -path '*release/bundle*' -maxdepth 6 -type f | head -40 || true

      - uses: actions/upload-artifact@v4
        with:
          name: veil-${{ matrix.name }}
          path: |
            target/**/release/bundle/**/*.dmg
            target/**/release/bundle/**/*.msi
            target/**/release/bundle/**/*.exe
            target/**/release/bundle/**/*.AppImage
            target/**/release/bundle/**/*.deb
          if-no-files-found: error
