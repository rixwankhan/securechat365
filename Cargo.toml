[workspace]
resolver = "2"
members = ["crates/core", "crates/relay", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
anyhow = "1"
thiserror = "2"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
