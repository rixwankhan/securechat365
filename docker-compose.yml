# Both services run on the host network.
#
# Podman's port publishing silently fails on some hosts: compose reports the
# mapping and `ss` shows a listener, but the NETAVARK-HOSTPORT-DNAT chain stays
# empty and nothing from outside ever arrives. Host networking sidesteps the
# whole layer — Caddy binds the real interface directly.
#
# The trade-off is that container ports are no longer isolated, which is why the
# relay binds loopback only and is reachable solely through Caddy.

services:
  relay:
    build: .
    restart: unless-stopped
    network_mode: host
    environment:
      # Loopback only. On the host network, 0.0.0.0 would expose the relay
      # directly on port 8080, bypassing TLS entirely.
      VEIL_BIND: "127.0.0.1:8080"
      # Keep this at info in production. Debug logs every message's routing
      # metadata — who talked to whom and when — which is exactly the data
      # you told users you don't retain.
      RUST_LOG: securechat365_relay=info

  caddy:
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - relay

volumes:
  caddy_data:
  caddy_config:
